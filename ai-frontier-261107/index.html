const d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(pw){
  const k0=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:d(S),iterations:N,hash:"SHA-256"},k0,{name:"AES-GCM",length:256},false,["decrypt"]);
  const p=await crypto.subtle.decrypt({name:"AES-GCM",iv:d(I)},k,d(C));
  return new TextDecoder().decode(p);
}
async function show(pw,remember){
  const html=await open_(pw);
  if(remember){try{sessionStorage.setItem("pw:"+location.pathname,pw)}catch(e){}}
  document.open();document.write(html);document.close();
}
document.getElementById("f").addEventListener("submit",async e=>{
  e.preventDefault();const m=document.getElementById("msg");m.textContent="여는 중…";
  try{await show(document.getElementById("pw").value,true)}catch(err){m.textContent="비밀번호가 맞지 않아요."}
});
(async()=>{let s=null;try{s=sessionStorage.getItem("pw:"+location.pathname)}catch(e){}if(s){try{await show(s,false)}catch(e){}}})();
