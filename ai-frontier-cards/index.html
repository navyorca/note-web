<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>AI 세미나 카드뉴스</title>
<style>
:root{--bg:#ffffff;--ink:#1b1d21;--mute:#5b616b;--accent:#0b4fa8}
@media (prefers-color-scheme:dark){:root{--bg:#17191d;--ink:#f2f3f5;--mute:#a3a8b1;--accent:#8db8ff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Malgun Gothic",-apple-system,sans-serif;word-break:keep-all;font-size:19px}
main{max-width:1120px;margin:0 auto;padding:40px 16px 64px}
h1{font-size:26px;margin:0 0 8px}
p.lead{margin:0 0 32px;color:var(--mute)}
h2{font-size:21px;margin:40px 0 16px;padding-bottom:8px;border-bottom:2px solid var(--ink)}
h2 span{color:var(--accent);margin-right:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.grid a{display:block;border-radius:10px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.grid img{display:block;width:100%;height:auto}
footer{margin-top:40px;color:var(--mute);font-size:16px}
</style></head><body><main>
